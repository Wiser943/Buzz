<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Buzzer — Sports community</title>
  <link rel="stylesheet" href="/styles.css?v=18" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation"><i data-lucide="menu"></i></button>
      <a class="brand" href="/" aria-label="Buzzer home"><img class="brand-logo" src="/logo-mark.png" alt=""><img class="brand-word" src="/logo-word.png" alt="Buzzer"></a>
      <div class="top-search"><i data-lucide="search"></i><input id="search" placeholder="Explore" aria-label="Search" /></div>
      <div class="top-actions"><button class="icon-btn m-only" id="mSearch" title="Search"><i data-lucide="search"></i></button><button class="create-btn" id="createBtn">＋ Create</button><button class="auth-top-btn" id="authTopBtn">Join / Login</button><button class="icon-btn" id="msgBtn" title="Messages"><i data-lucide="messages-square"></i></button><button class="icon-btn desk-only" id="bellTop" title="Notifications"><i data-lucide="bell"></i></button><button class="profile-mini desk-only" id="profileMini">S</button></div>
    </header>
    <aside class="sidebar" id="sidebar">
      <nav class="nav-list">
        <button class="nav-item active" data-view="home"><i data-lucide="house"></i> Home</button>
        <button class="nav-item" data-view="explore"><i data-lucide="compass"></i> Explore</button>
        <button class="nav-item" data-view="notifications"><i data-lucide="bell"></i> Notifications</button>
        <button class="nav-item" data-view="opportunities"><i data-lucide="target"></i> Opportunities</button>
        <button class="nav-item" data-view="news"><i data-lucide="newspaper"></i> News</button>
        <button class="nav-item" data-view="music"><i data-lucide="music"></i> Music</button>
        <button class="nav-item" data-view="communities"><i data-lucide="users"></i> Communities</button>
        <button class="nav-item" data-view="sports"><i data-lucide="trophy"></i> Sports</button>
        <button class="nav-item" data-view="messages"><i data-lucide="message-circle"></i> Messages</button>
        <button class="nav-item" data-view="admin" id="adminNav" style="display:none"><i data-lucide="shield-check"></i> Admin</button>
        <button class="nav-item" data-view="games"><i data-lucide="gamepad-2"></i> Games</button>
      </nav>
      <div class="sidebar-section"><div class="section-label">TRENDING NOW <span>⌃</span></div><div id="sideTrend"><small class="muted">Loading…</small></div></div>
      <div class="side-ad" id="sideAd"><div class="ad-copy">WHERE<br>SPORTS<br>LIVES</div><div class="ad-caption">Reach fans, athletes &amp; clubs inside the sports network.</div><button>START ADVERTISING</button></div>
      <div class="sidebar-section res"><div class="section-label">RESOURCES</div>
        <button class="res-link" id="resHelp">Help Center <i data-lucide="external-link"></i></button>
        <button class="res-link" id="resGuide">Community Guidelines <i data-lucide="external-link"></i></button>
        <button class="res-link" id="resAds">Advertise with Us <i data-lucide="external-link"></i></button>
        <div class="res-foot">© 2026 Buzzer<br><a id="resTerms">Terms of Service</a> | <a id="resPriv">Privacy Policy</a></div></div>
    </aside>
    <main id="main" class="main-content"></main>
    <aside class="rightbar" id="rightbar"></aside>
  </div>
  <nav class="bottom-nav" aria-label="Main">
    <button class="tab-item" data-view="home" aria-label="Home"><i data-lucide="house"></i></button>
    <button class="tab-item" data-view="explore" aria-label="Explore"><i data-lucide="compass"></i></button>
    <button class="tab-item" data-view="create" aria-label="Create"><i data-lucide="square-plus"></i></button>
    <button class="tab-item" data-view="notifications" aria-label="Notifications"><i data-lucide="bell"></i></button>
    <button class="tab-item" data-view="profile" aria-label="Profile"><span class="tab-avatar">S</span></button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js?v=18"></script>
  <script src="/screens.js?v=18"></script>
  <script src="/stage9.js?v=18"></script>
  <script src="/stage13.js?v=18"></script>
  <script src="/stage17.js?v=18"></script>
  <script src="/stage18.js?v=18"></script>
  <script src="/stage19.js?v=18"></script>
  <script src="/stage20.js?v=18"></script>
</body>
</html>
